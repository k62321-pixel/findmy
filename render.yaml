# Render Blueprint — New → Blueprint → pick this repo.
# Values marked sync: false are prompted for in the dashboard (never commit them).
services:
  - type: web
    name: found-it-api
    runtime: python
    rootDir: server
    # Free plan: the local disk is wiped on every restart, so all data (items and
    # photos) lives in the Postgres database at DATABASE_URL (e.g. Neon's free tier).
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /api/items
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
